<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>NECUM.ONLINE</title>
<style>
:root{
  --bg:#050505; --panel:#0b0b0b; --panel2:#101010; --line:#242424;
  --text:#f2f2f2; --muted:#858585; --dim:#565656;
  --green:#62ff9b; --red:#ff445c; --amber:#ffd56f; --blue:#79a9ff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html.locked,body.locked{overflow:hidden!important}
body{
  margin:0;min-height:100vh;background:
  radial-gradient(circle at 15% 0%,rgba(98,255,155,.03),transparent 28%),
  radial-gradient(circle at 100% 25%,rgba(255,68,92,.025),transparent 25%),
  var(--bg);color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}
.no-select{user-select:none}

.topbar{
  position:sticky;top:0;z-index:4000;height:72px;
  border-bottom:1px solid var(--line);background:rgba(5,5,5,.92);backdrop-filter:blur(18px)
}
.topbar-inner{
  max-width:1500px;height:100%;margin:auto;padding:0 34px;
  display:flex;align-items:center;justify-content:space-between
}
.brand{
  font:700 18px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.08em
}
.brand span{color:var(--green)}
.top-actions{display:flex;align-items:center;gap:10px}
.live{
  color:#6d6d6d;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;
  padding-right:4px
}
.live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;box-shadow:0 0 12px rgba(98,255,155,.5)}
.icon{
  width:42px;height:42px;border-radius:11px;border:1px solid var(--line);
  background:#090909;color:#aaa;display:grid;place-items:center;transition:.18s
}
.icon:hover{color:#fff;border-color:#3b3b3b}

.menu{
  position:fixed;right:24px;top:86px;z-index:6000;
  width:min(340px,calc(100vw - 32px));padding:9px;
  background:rgba(8,8,8,.985);border:1px solid #2a2a2a;border-radius:16px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  opacity:0;visibility:hidden;transform:translateY(-8px) scale(.985);transition:.18s
}
.menu.open{opacity:1;visibility:visible;transform:none}
.menu a,.menu button{
  width:100%;border:0;background:transparent;color:#c7c7c7;
  border-radius:11px;padding:14px 13px;display:flex;justify-content:space-between;
  text-align:left;align-items:center
}
.menu a:hover,.menu button:hover{background:#141414;color:#fff}
.menu small{color:#606060;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em}
.menu-divider{height:1px;background:#1c1c1c;margin:8px 0}

.shell{max-width:1500px;margin:auto;padding:0 34px 90px}
.view{display:none}.view.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}

.home{
  min-height:calc(100vh - 72px);display:grid;place-items:center;text-align:center;padding:40px 0
}
.home-inner{width:min(820px,100%);padding:50px 20px}
.home-logo{
  font:800 clamp(58px,9vw,132px)/.9 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:-.065em
}
.home-logo span{color:var(--green)}
.home-rule{height:1px;background:linear-gradient(90deg,transparent,#343434,transparent);margin:28px auto 17px}
.home-sub{color:#666;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.24em}
.home-btn{margin-top:32px;min-width:200px}

.page-head{padding:74px 0 30px}
.page-head .back{margin-bottom:24px}
.eyebrow{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.17em;color:#666;text-transform:uppercase}
.page-head h1{
  margin:15px 0 18px;font-size:clamp(54px,7vw,104px);line-height:.86;
  letter-spacing:-.065em
}
.page-head p{max-width:790px;margin:0;color:#898989;line-height:1.8;font-size:14px}

.btn{
  border:1px solid #303030;background:#0d0d0d;color:#ededed;
  border-radius:11px;padding:11px 14px;transition:.18s;font-size:13px
}
.btn:hover{border-color:#4a4a4a;transform:translateY(-1px)}
.btn.green{background:var(--green);border-color:var(--green);color:#07100b;font-weight:800}
.btn.red{color:#ff9fac;border-color:rgba(255,68,92,.36)}
.btn.amber{color:#ffe7a5;border-color:rgba(255,213,111,.32)}
.back{color:#8f8f8f}

.panel{
  border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#0e0e0e,#0a0a0a);
  box-shadow:0 22px 70px rgba(0,0,0,.18)
}
.panel-pad{padding:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.list{display:grid;gap:10px}
.row{
  border:1px solid #1d1d1d;background:#090909;border-radius:13px;
  padding:14px 15px;color:#8c8c8c;font-size:13px
}
.row b{color:#dedede}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:17px;border:1px solid #1c1c1c;border-radius:14px;background:#090909}
.kpi small{display:block;color:#5a5a5a;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}
.kpi strong{display:block;font-size:21px;margin-top:9px}
.green-t{color:var(--green)}.red-t{color:var(--red)}.amber-t{color:var(--amber)}

.school-tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{
  border:1px solid var(--line);background:#090909;color:#898989;
  border-radius:10px;padding:10px 12px
}
.tab.active{background:#ebebeb;color:#111;border-color:#ebebeb;font-weight:800}
.school-body{display:grid;grid-template-columns:1.08fr .92fr;gap:16px}
.school-copy{padding:19px;border:1px solid #1d1d1d;border-radius:14px;background:#090909}
.school-copy h2{margin:0 0 9px;font-size:22px}.school-copy p{margin:0;color:#858585;line-height:1.75;font-size:13px}
.school-copy .quote{margin-top:15px;color:#a8a8a8;font:12px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace}
.school-stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.feature{
  border:1px solid var(--line);border-radius:18px;background:#0b0b0b;
  padding:22px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between
}
.feature h2{margin:10px 0 7px;font-size:23px}.feature p{margin:0;color:#7d7d7d;line-height:1.7;font-size:13px}
.feature-index{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#5b5b5b;letter-spacing:.12em}
.feature-actions{display:flex;gap:9px;flex-wrap:wrap}

.messages{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.message{
  border:1px solid var(--line);border-radius:14px;padding:18px;background:#0b0b0b;
  color:#858585;font-size:13px;line-height:1.75
}
.message b{color:#e2e2e2}

footer{
  padding:36px 0;color:#4f4f4f;text-align:center;
  font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em
}

/* Modals: fully lock the underlying page */
.modal-wrap{
  position:fixed;inset:0;z-index:9000;
  display:flex;align-items:center;justify-content:center;
  padding:18px;background:rgba(0,0,0,.84);backdrop-filter:blur(11px);
  opacity:0;visibility:hidden;transition:.18s
}
.modal-wrap.open{opacity:1;visibility:visible}
.modal{
  width:min(980px,100%);max-height:92vh;overflow:auto;
  border:1px solid #2d2d2d;border-radius:18px;background:#070707;
  box-shadow:0 28px 100px rgba(0,0,0,.78)
}
.modal-head{
  position:sticky;top:0;z-index:2;padding:13px 15px;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--line);background:rgba(7,7,7,.94);backdrop-filter:blur(9px)
}
.modal-head h3{margin:0;font-size:15px}
.close{border:1px solid #2a2a2a;background:#0c0c0c;color:#aaa;border-radius:9px;padding:8px 10px}
.modal-body{padding:24px}

/* Download */
.download-stage{padding:10px}
.dl-top{
  display:flex;justify-content:space-between;gap:15px;align-items:end;
  padding-bottom:18px;border-bottom:1px solid #1a1a1a
}
.file-title{display:flex;gap:15px;align-items:center}
.file-emoji{font-size:56px}
.file-title h2{margin:0;font-size:25px}.file-title p{margin:5px 0 0;color:#666;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
.dl-alert{
  margin-top:18px;padding:15px;border:1px solid rgba(255,68,92,.28);
  border-radius:13px;background:rgba(255,68,92,.045);color:#ff9ba7;font-size:12px;line-height:1.7
}
.dl-console{
  margin-top:15px;border:1px solid #1d1d1d;border-radius:14px;overflow:hidden;background:#080808
}
.dl-console-head{padding:11px 13px;border-bottom:1px solid #181818;color:#686868;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}
.dl-output{padding:16px;font:12px/1.85 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8d8d8d;min-height:165px}
.dl-progress{height:10px;background:#151515;border-radius:99px;overflow:hidden;margin:0 16px 16px}
.dl-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),#ff9ba7)}
.dl-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.dl-reveal{
  display:none;margin-top:16px;padding:18px;border-radius:14px;
  border:1px solid rgba(98,255,155,.25);background:rgba(98,255,155,.035)
}
.dl-reveal.open{display:block;animation:fade .2s ease}
.dl-reveal h3{margin:0 0 7px;color:var(--green);font-size:22px}.dl-reveal p{margin:0;color:#808080;font-size:13px;line-height:1.7}

/* Scanner */
.scanner-grid{display:grid;grid-template-columns:290px 1fr;gap:24px;align-items:center}
.ring{width:245px;height:245px;border-radius:50%;margin:auto;display:grid;place-items:center;background:conic-gradient(var(--green) 0deg,#172019 0deg);position:relative}
.ring:after{content:"";position:absolute;inset:14px;border-radius:50%;background:#070707;border:1px solid #171717}
.ring-center{position:relative;z-index:1;text-align:center}.percent{font-size:48px;font-weight:800}.scan-state{margin-top:4px;color:#686868;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}
.scan-list{border:1px solid #1b1b1b;border-radius:14px;overflow:hidden}
.scan-row{padding:12px 14px;border-bottom:1px solid #131313;color:#666;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
.scan-row:last-child{border-bottom:0}.scan-row.active{background:#0b0b0b;color:#fff}.scan-row.active:before{content:"→ ";color:var(--amber)}.scan-row.done:before{content:"✓ ";color:var(--green)}
.scan-result{
  margin-top:19px;padding:18px;border:1px solid rgba(255,68,92,.3);border-radius:14px;background:rgba(255,68,92,.045);text-align:center
}
.scan-result h3{margin:0 0 8px;color:#ff8c9a;font-size:24px}.scan-result p{margin:0;color:#8d8d8d;font-size:13px;line-height:1.7}

/* Terminal */
.term{background:#030403;border:1px solid #18351f;border-radius:14px;padding:16px;color:#b8ffca}
.term-out{min-height:330px;max-height:48vh;overflow:auto;white-space:pre-wrap;font:12px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace}
.term-line{display:flex;gap:8px;border-top:1px solid #102015;padding-top:10px}.prompt{color:var(--green)}.term-in{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#e0ffe8}

/* Secret */
.secret{text-align:center;padding:30px 15px}.secret-icon{font-size:70px}.secret h2{font-size:30px;margin:12px 0}.secret p{color:#828282;line-height:1.7}
.dont-btn{margin-top:10px}

/* Serious */
.locked-panel{padding:24px;text-align:center}
.code-row{display:flex;gap:9px;max-width:480px;margin:20px auto 0}
.code-input{flex:1;min-width:0;border:1px solid #2a2a2a;background:#090909;color:#fff;border-radius:10px;padding:12px 13px;outline:0}
.code-input:focus{border-color:#4b4b4b}
.cooldown{min-height:19px;margin-top:11px;color:#ff8d9b;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
.empty-secret{min-height:420px;display:grid;place-items:center;text-align:center}
.empty-secret .mark{font-size:72px;color:#666}.empty-secret h2{margin:10px 0;font-size:30px}.empty-secret p{color:#666}

/* Popup storm */
#popupLayer{position:fixed;inset:0;z-index:15000;pointer-events:none}
.popup{
  position:absolute;width:min(350px,82vw);padding:13px;
  background:#101010;border:1px solid #54202a;border-radius:10px;
  box-shadow:0 20px 70px rgba(0,0,0,.58);
  color:#e5e5e5;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;
  animation:pop .15s ease
}
.popup .ph{display:flex;justify-content:space-between;gap:10px;padding-bottom:8px;margin-bottom:9px;border-bottom:1px solid #272727;color:#ff7b8a}
.popup small{color:#676767}
@keyframes pop{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}

.toast{
  position:fixed;left:50%;bottom:18px;z-index:20000;transform:translate(-50%,20px);
  opacity:0;pointer-events:none;max-width:min(92vw,700px);padding:11px 14px;
  border:1px solid #2c2c2c;border-radius:10px;background:#0a0a0a;color:#ddd;text-align:center;font-size:12px;transition:.2s
}
.toast.show{opacity:1;transform:translate(-50%,0)}

body.glitch{animation:gl .11s steps(2) 4}
@keyframes gl{30%{transform:translateX(2px);filter:hue-rotate(22deg)}65%{transform:translateX(-3px);filter:contrast(1.25)}}


/* Mobile-first refinements */
@media (max-width: 760px) {
  html, body { width:100%; max-width:100%; overflow-x:hidden; }
  body { min-width:0; }
  .topbar {
    height: 60px;
    width:100%;
  }
  .topbar-inner {
    width:100%;
    max-width:none;
    min-width:0;
    padding:0 12px;
  }
  .brand {
    font-size:15px;
    white-space:nowrap;
  }
  .top-actions { gap:6px; }
  .icon {
    width:40px;
    height:40px;
    flex:0 0 40px;
  }

  .shell {
    width:100%;
    max-width:none;
    padding:0 12px 48px;
  }

  .home {
    min-height:calc(100svh - 60px);
    width:100%;
    padding:20px 4px;
    display:grid;
    place-items:center;
  }
  .home-inner {
    width:100%;
    max-width:100%;
    padding:24px 8px;
  }
  .home-logo {
    font-size:clamp(42px, 13vw, 78px);
    line-height:.9;
    word-break:keep-all;
    overflow-wrap:normal;
  }
  .home-sub {
    font-size:9px;
    letter-spacing:.18em;
    line-height:1.6;
  }
  .home-btn {
    width:min(240px, 76vw);
    min-width:0;
    padding:13px 18px;
  }

  .menu {
    top:68px;
    right:8px;
    width:calc(100vw - 16px);
    max-width:380px;
  }

  .page-head {
    width:100%;
    padding:38px 0 20px;
  }
  .page-head h1 {
    font-size:clamp(44px, 14vw, 64px);
    line-height:.9;
    margin:14px 0 14px;
  }
  .page-head p {
    font-size:13px;
    line-height:1.65;
    max-width:none;
  }

  .panel,
  .panel-pad {
    width:100%;
    max-width:100%;
  }
  .panel-pad { padding:15px; }

  .grid2,
  .grid3,
  .card-grid,
  .messages,
  .scanner-grid {
    grid-template-columns:1fr;
  }

  .kpi-grid {
    grid-template-columns:1fr 1fr;
    gap:9px;
  }
  .kpi {
    min-width:0;
    padding:14px 12px;
  }
  .kpi strong {
    font-size:18px;
    overflow-wrap:anywhere;
  }

  .school-body {
    grid-template-columns:1fr;
  }
  .school-stat {
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .feature {
    min-height:195px;
  }

  .modal-wrap {
    inset:0;
    width:100vw;
    height:100svh;
    padding:0;
    align-items:flex-start;
  }
  .modal {
    width:100%;
    max-width:none;
    height:auto;
    max-height:100svh;
    min-height:100svh;
    border-radius:0;
    border-left:0;
    border-right:0;
    display:flex;
    flex-direction:column;
  }
  .modal-head {
    min-height:58px;
    flex:0 0 58px;
    padding:10px 12px;
  }
  .modal-body {
    width:100%;
    flex:1 1 auto;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    padding:14px 12px 24px;
  }

  .download-stage {
    width:100%;
    padding:4px 0;
  }
  .dl-top {
    display:block;
    padding-bottom:16px;
  }
  .file-title {
    align-items:flex-start;
  }
  .file-emoji {
    font-size:45px;
    flex:0 0 auto;
  }
  .file-title h2 {
    font-size:21px;
    line-height:1.1;
    overflow-wrap:anywhere;
  }
  .file-title p {
    line-height:1.5;
    overflow-wrap:anywhere;
  }
  .dl-alert {
    font-size:11px;
    line-height:1.65;
  }
  .dl-console {
    width:100%;
  }
  .dl-output {
    min-height:160px;
    max-height:35svh;
    overflow:auto;
    font-size:11px;
    line-height:1.75;
    word-break:break-word;
  }
  .dl-actions {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .dl-actions .btn {
    width:100%;
    min-width:0;
  }

  .ring {
    width:min(205px, 58vw);
    height:min(205px, 58vw);
  }
  .percent {
    font-size:clamp(36px, 11vw, 46px);
  }
  .scan-list {
    width:100%;
  }
  .scan-row {
    font-size:11px;
    padding:11px 12px;
  }

  .term-out {
    min-height:48svh;
    max-height:54svh;
    font-size:11px;
  }
  .term-line {
    align-items:flex-start;
  }
  .term-in {
    font-size:12px;
  }

  .code-row {
    display:grid;
    grid-template-columns:1fr;
    width:100%;
    max-width:none;
  }
  .code-input,
  #unlockBtn {
    width:100%;
    min-height:46px;
  }

  .empty-secret {
    min-height:55svh;
    padding:20px;
  }

  .popup {
    width:min(300px, 78vw);
    font-size:10px;
  }

  footer {
    padding:26px 0;
    line-height:1.6;
  }
}

/* Ultra-small phones */
@media (max-width: 390px) {
  .shell { padding-left:9px; padding-right:9px; }
  .topbar-inner { padding:0 9px; }
  .home-logo { font-size:42px; }
  .kpi-grid,
  .school-stat { grid-template-columns:1fr; }
  .dl-actions { grid-template-columns:1fr; }
  .page-head h1 { font-size:43px; }
}

/* Tall portrait phones */
@media (max-width: 760px) and (min-height: 800px) {
  .home { min-height:calc(100svh - 60px); }
  .home-inner { transform:translateY(-2vh); }
}

/* Landscape phones */
@media (max-width: 900px) and (orientation:landscape) {
  .home {
    min-height:calc(100svh - 60px);
    padding:14px 0;
  }
  .home-inner { padding:16px; }
  .home-logo { font-size:clamp(38px, 10vw, 62px); }
  .modal {
    min-height:100svh;
  }
  .modal-body {
    padding-bottom:18px;
  }
}

@media(max-width:1050px){
  .card-grid{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .school-body{grid-template-columns:1fr}
}
@media(max-width:760px){
  .topbar{height:62px}.topbar-inner{padding:0 13px}.shell{padding:0 13px 65px}
  .live{display:none}.menu{right:12px;top:74px}
  .home{min-height:calc(100vh - 62px)}.home-inner{padding:36px 10px}
  .home-logo{font-size:clamp(50px,15vw,88px)}.home-sub{font-size:9px}
  .page-head{padding:48px 0 23px}.page-head h1{font-size:54px}
  .card-grid{grid-template-columns:1fr}.grid3,.messages{grid-template-columns:1fr}.kpi-grid{grid-template-columns:1fr 1fr}
